[project]
name = "radstudio-sdk"
version = "0.2.0"
description = "RadStudio Python SDK for medical imaging radiomics"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.9.1",
    "pillow>=12.3.0",
    "joblib>=1.6.0",
    "jsonschema>=4.26.0",
    "openpyxl>=3.1.5",
    # PaperFigures 出版级图表（PNG/PDF/SVG/TIFF）
    "matplotlib>=3.9.0",
    # 小波滤波（ImageFilterBank wavelet 派生）需要 PyWavelets
    "pywavelets>=1.4.0",
    # PyRadiomics：PyPI sdist 损坏（缺 cmatrices.h，见上游 issue #949），
    # 只能从 GitHub 源码构建并钉死 commit 以保证可复现。
    "pyradiomics @ https://github.com/AIM-Harvard/pyradiomics/archive/8ed579383b44806651c463d5e691f3b2b57522ab.tar.gz",
]

# pyradiomics 从源码构建需要以下构建依赖；必须显式声明，
# 否则 uv 的构建隔离环境里缺少 numpy/C 构建工具会导致编译失败。
[tool.uv.extra-build-dependencies]
pyradiomics = ["numpy", "setuptools", "wheel", "versioneer", "scikit_build_core", "setuptools_scm"]

# 让 uv 把 radstudio-sdk 自身以 editable 方式装入环境（此前依赖手动
# pip install -e .，uv sync 的精确同步会将其移除导致测试找不到包）。
# hatchling 默认打包 radstudio/ 目录全部文件（含 operators.json 目录文件）。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radstudio"]

# pyradiomics 依赖为钉死 commit 的直链源码引用（见上文说明）
[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
# 深度学习算子（DLCNNTraining/DLCNNInference）运行时依赖；
# 独立 extra + 独立镜像（Dockerfile.operator-dl），不进入基础算子镜像
dl = [
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    # 医学影像专用变换（RandRotated/RandZoomd 等）、DenseNet121/SEResNet50
    # 骨干、FocalLoss 与 AUC/混淆矩阵指标；仅进入 DL 算子镜像
    "monai>=1.6,<2",
]
# 用户自定义算子运行时（Dockerfile.operator-user）的预置轮子。
# 白名单口径是「声明的依赖必须在镜像里真的存在」：numpy/scipy/scikit-learn/pillow
# 已随基础依赖就位，这里只补 DEFAULT_ALLOW_PACKAGES 里唯一缺的 pandas，
# 否则用户按白名单写 import pandas 只会得到 ModuleNotFoundError。
# 禁 pip：装不上的包一律以 user_dependency_blocked 报错，不做运行时安装。
user = [
    "pandas>=2.2",
]
# 单细胞研究算子（ScDataInput/ScQualityControl 及后续 MVP 链）运行时依赖；
# 独立 extra + 独立镜像（Dockerfile.operator-sc），不进入基础算子镜像。
# leidenalg+igraph 为 Leiden 聚类（阶段 2 ScClustering）预先就位。
sc = [
    "scanpy>=1.10,<2",
    "anndata>=0.10,<1",
    "leidenalg>=0.10,<1",
    "igraph>=0.11,<1",
]
# 读取节点 ReadSingleCell 只需要 AnnData 读写（不需要 scanpy）。
# 本地 docker 执行端只有一个 runner 镜像，因此把它装进 runner，避免
# 「读取节点在默认执行环境不可用」。FC 侧仍可用 sc 镜像承载研究算子。
readers-sc = [
    "anndata>=0.10,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

# 本地开发/测试默认解析 CPU 版 torch（PyPI 的 Linux CUDA 轮子 2GB+）；
# DL 算子镜像（Dockerfile.operator-dl）用 build-arg 按需切换 CUDA index。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[project.scripts]
radstudio-runner = "radstudio.runner:main"
radstudio-operator-serve = "radstudio.operator_serve:main"
radstudio-user-serve = "radstudio.user_serve:main"

[project.urls]
Homepage = "https://github.com/RadStudioTeam/RadStudio-Local"
Documentation = "https://github.com/RadStudioTeam/RadStudio-Local#readme"
Issues = "https://github.com/RadStudioTeam/RadStudio-Local/issues"
