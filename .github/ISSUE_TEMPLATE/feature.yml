name: Feature request
description: 提出功能建议（先说明使用场景）
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题？
      description: 描述科研场景，而不是直接给方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
  - type: dropdown
    id: scope
    attributes:
      label: 属于哪类
      options:
        - 本地 UI（v0.2 范围内）
        - CLI / runner
        - 算子 / 契约
        - 文档 / 示例
        - 不确定
    validations:
      required: true
