name: Bug report
description: 报告可复现的问题（请勿包含患者数据）
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。**请勿粘贴患者影像、姓名、ID、院内路径或未脱敏截图。**
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: "v0.1.0-beta / commit"
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: 环境
      options:
        - Linux
        - macOS
        - Windows (Docker)
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. ... 2. ... 3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 vs 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志/报错（请脱敏）
      render: shell
