name: SDK CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync dependencies
        working-directory: packages/python-sdk
        run: uv sync --extra dev --frozen

      - name: Lint
        working-directory: packages/python-sdk
        run: uv run ruff check .

      - name: Test
        working-directory: packages/python-sdk
        run: uv run pytest -q

      - name: Schema JSON validity
        run: |
          set -euo pipefail
          find packages -name '*.schema.json' -print0 | while IFS= read -r -d '' f; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f"
          done

  selfcheck:
    name: IBSI 2D selfcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Run reproduction package
        run: bash reproductions/p1-ibsi-2d/reproduction/run.sh

  docker:
    name: Docker runner image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runner image
        run: docker build -t radstudio-local -f packages/python-sdk/Dockerfile.runner .
      - name: CLI doctor in container
        run: docker run --rm radstudio-local doctor
      - name: Web UI healthz in container
        run: |
          set -euo pipefail
          docker run -d --name radstudio-ui -p 127.0.0.1:8765:8765 radstudio-local ui --no-browser --host 0.0.0.0 --workspace /tmp/ws
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/healthz >/tmp/healthz.json; then break; fi
            sleep 1
          done
          cat /tmp/healthz.json
          grep -q '"status": "ok"' /tmp/healthz.json
          docker logs radstudio-ui
          docker rm -f radstudio-ui
